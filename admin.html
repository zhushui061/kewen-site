<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>订单后台 · 科文中医</title>
<style>
:root{--accent:#2563eb;--ink:#152036;--ink2:#55617a;--ink3:#8b96ab;--line:#e2e8f4}
body{margin:0;background:#f4f7fd;color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--ink3);font-size:12.5px;margin-bottom:18px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;width:100%;box-sizing:border-box;margin-bottom:10px}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer}
button.ghost{background:#eef4ff;color:var(--accent)}
.row{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:12px 0}
.row:last-child{border-bottom:0}
.thumb{width:64px;height:64px;border-radius:8px;border:1px solid var(--line);object-fit:cover;background:#f2f6ff}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--ink2);word-break:break-all}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:#eef4ff;color:var(--accent);margin-right:6px}
.hint{font-size:12.5px;color:var(--ink3)}
</style>
</head>
<body>
<div class="wrap">
  <h1>订单后台</h1>
  <div class="sub">仅作者使用 · 页面不对外公开</div>

  <div class="box" id="loginBox">
    <div class="hint" style="margin-bottom:10px">用你在 Supabase 里创建的邮箱账号登录</div>
    <input id="email" placeholder="邮箱" autocomplete="username">
    <input id="pwd" type="password" placeholder="密码" autocomplete="current-password">
    <button onclick="login()">登录</button>
    <div class="hint" id="loginMsg" style="margin-top:8px"></div>
  </div>

  <div class="box" id="listBox" style="display:none">
    <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap">
      <button class="ghost" onclick="load()">刷新</button>
      <span class="hint" id="count" style="align-self:center"></span>
      <button class="ghost" style="margin-left:auto" onclick="logout()">退出</button>
    </div>
    <div id="rows"></div>
  </div>
</div>

<script>
var SUPABASE_URL = "";   // https://xxxx.supabase.co
var SUPABASE_KEY = "";   // anon public key
var TOKEN = localStorage.getItem('kw_admin_token') || '';
var TESTFLIGHT = 'https://testflight.apple.com/join/7K8RWTs2';
var PKG_PAGE = 'download.html';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

async function login(){
  var msg = document.getElementById('loginMsg');
  if (!SUPABASE_URL) { msg.textContent = '尚未配置 SUPABASE_URL / SUPABASE_KEY'; return; }
  msg.textContent = '登录中…';
  var r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pwd').value })
  });
  var j = await r.json();
  if (!r.ok || !j.access_token) { msg.textContent = '登录失败：' + (j.error_description || j.msg || r.status); return; }
  TOKEN = j.access_token;
  localStorage.setItem('kw_admin_token', TOKEN);
  showList();
}
function logout(){ TOKEN = ''; localStorage.removeItem('kw_admin_token'); document.getElementById('listBox').style.display='none'; document.getElementById('loginBox').style.display=''; }
function showList(){ document.getElementById('loginBox').style.display='none'; document.getElementById('listBox').style.display=''; load(); }

async function load(){
  var r = await fetch(SUPABASE_URL + '/rest/v1/kw_orders?select=*&order=created_at.desc&limit=200', {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + TOKEN }
  });
  if (r.status === 401 || r.status === 403) { logout(); return; }
  var list = await r.json();
  document.getElementById('count').textContent = '共 ' + list.length + ' 条';
  document.getElementById('rows').innerHTML = list.map(function(o){
    var shot = o.shot_url ? '<a href="' + esc(o.shot_url) + '" target="_blank"><img class="thumb" src="' + esc(o.shot_url) + '"></a>' : '<div class="thumb" style="display:grid;place-items:center;font-size:11px;color:#8b96ab">无图</div>';
    var links = o.sku === 'ios'
      ? '<button class="ghost" onclick="navigator.clipboard.writeText(\'' + TESTFLIGHT + '\')">复制公测链接</button>'
      : '<button class="ghost" onclick="navigator.clipboard.writeText(location.origin + location.pathname.replace(/admin\\.html$/, \'\') + \'' + PKG_PAGE + '\')">复制安装包页</button>';
    return '<div class="row">' + shot +
      '<div style="flex:1">' +
      '<div><span class="tag">' + esc(o.sku) + '</span><b>' + esc(o.phone) + '</b></div>' +
      '<div class="mono">' + esc(o.created_at || '') + '</div>' +
      '<div style="margin-top:6px" class="hint">' + (o.note ? esc(o.note) : '') + '</div>' +
      '</div><div style="display:flex;flex-direction:column;gap:6px">' + links +
      '<button class="ghost" onclick="markDone(' + o.id + ')">标记已处理</button></div></div>';
  }).join('') || '<div class="hint">还没有提交</div>';
}

async function markDone(id){
  await fetch(SUPABASE_URL + '/rest/v1/kw_orders?id=eq.' + id, {
    method: 'PATCH',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ done: true })
  });
  load();
}

if (TOKEN) showList();
</script>
</body>
</html>
